# Cleanup redirects config file.
name: Redirects cleanup PR

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "current_date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
        with:
          node-version: '14.17'
          cache: 'yarn'
      - run: yarn
      - run: yarn run clean-redirects
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@01f7dd1d28f5131231ba3ede0f1c8cb413584a1d # v3.9.2
        with:
          commit-message: Redirects config cleanup ${{ env.current_date }}
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: clean_redirects_action_${{ env.current_date }}
          delete-branch: true
          title: 'Redirects config cleanup ${{ env.current_date }}'